<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учёт выполнения лабораторных работ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="brand">
                <span class="brand-mark">§</span>
                <span class="brand-text">Журнал<br>лабораторных</span>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Обзор</a>
                <a href="{{ url_for('students_list') }}">Студенты</a>
                <a href="{{ url_for('disciplines_list') }}">Дисциплины</a>
                <a href="{{ url_for('labs_list') }}">Лаб. работы</a>
                <a href="{{ url_for('tracking') }}">Учёт выполнения</a>
            </div>
        </nav>

        <main class="content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
